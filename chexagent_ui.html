<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RadPulse CXR Test Tool</title>
<style>
body {
  font-family: sans-serif;
  padding: 20px;
  max-width: 900px;
  margin: 0 auto;
}
.header {
  border-bottom: 1px solid #ccc;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
.row {
  display: flex;
  gap: 20px;
}
.col {
  flex: 1;
}
.border-box {
  border: 1px solid #ccc;
  padding: 15px;
  border-radius: 4px;
  background: #fdfdfd;
  margin-bottom: 15px;
}
.drop-zone {
  border: 2px dashed #bbb;
  padding: 30px;
  text-align: center;
  background: #fafafa;
  cursor: pointer;
}
.preview {
  max-width: 100%;
  max-height: 200px;
  margin-top: 10px;
  display: none;
}
.report {
  background: #f4f4f4;
  padding: 10px;
  border: 1px solid #ddd;
  min-height: 80px;
  white-space: pre-wrap;
}
.chat-logs {
  border: 1px solid #ddd;
  height: 180px;
  overflow-y: auto;
  padding: 10px;
  background: #fff;
  margin-bottom: 10px;
}
.msg {
  margin-bottom: 8px;
  padding: 6px;
  border-radius: 4px;
}
.doc {
  background: #d1ecf1;
}
.agent {
  background: #e2e3e5;
}
input[type="text"], select, input[type="password"] {
  padding: 6px;
  margin-bottom: 10px;
  width: 100%;
}
button {
  padding: 8px 12px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="header">
  <h2>RadPulse CXR Analyzer</h2>
  <div>
    <label>Model: </label>
    <select id="modelSelect" style="width:200px;">
      <option value="2-3b">CheXagent-2.3B</option>
      <option value="8b">CheXagent-8B</option>
      <option value="chexone">CheXOne</option>
    </select>
    <label style="margin-left: 15px;">HF Token: </label>
    <input type="password" id="hfToken" style="width:200px;" placeholder="Optional HF Token">
  </div>
</div>

<div class="row">
  <div class="col">
    <div class="border-box">
      <h3>Image Upload</h3>
      <div class="drop-zone" id="dropZone">
        <span id="dropText">Click or Drop X-Ray here</span>
        <img id="imgPreview" class="preview" alt="Preview">
      </div>
      <input type="file" id="fileInput" style="display:none;" accept="image/*">
      <br>
      <button id="analyzeBtn" disabled>Analyze Scan</button>
      <button id="resetBtn" style="margin-left:10px; display:none;">Reset</button>
      <div id="statusText" style="margin-top:10px; font-style:italic; color:#666;"></div>
    </div>
  </div>
  
  <div class="col">
    <div class="border-box">
      <h3>Findings / Report</h3>
      <div class="report" id="reportText">No analysis run yet.</div>
    </div>
    
    <div class="border-box">
      <h3>Chat with Scan</h3>
      <div class="chat-logs" id="chatLogs">
        <div class="msg agent">Ready to answer clinical questions about the scan.</div>
      </div>
      <div style="display:flex; gap:10px;">
        <input type="text" id="chatInput" placeholder="Ask a question..." disabled>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
  </div>
</div>

<script>
let imgBase64 = null;
let activePath = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const imgPreview = document.getElementById('imgPreview');
const dropText = document.getElementById('dropText');
const analyzeBtn = document.getElementById('analyzeBtn');
const resetBtn = document.getElementById('resetBtn');
const statusText = document.getElementById('statusText');
const reportText = document.getElementById('reportText');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const chatLogs = document.getElementById('chatLogs');

dropZone.onclick = () => fileInput.click();

dropZone.ondragover = (e) => {
  e.preventDefault();
};

dropZone.ondrop = (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length > 0) {
    loadImg(e.dataTransfer.files[0]);
  }
};

fileInput.onchange = (e) => {
  if (e.target.files.length > 0) {
    loadImg(e.target.files[0]);
  }
};

function loadImg(file) {
  const r = new FileReader();
  r.readAsDataURL(file);
  r.onload = () => {
    imgBase64 = r.result;
    imgPreview.src = r.result;
    imgPreview.style.display = 'block';
    dropText.style.display = 'none';
    analyzeBtn.disabled = false;
    resetBtn.style.display = 'inline-block';
  };
}

resetBtn.onclick = () => {
  imgBase64 = null;
  activePath = null;
  fileInput.value = '';
  imgPreview.src = '';
  imgPreview.style.display = 'none';
  dropText.style.display = 'block';
  analyzeBtn.disabled = true;
  resetBtn.style.display = 'none';
  reportText.innerText = 'No analysis run yet.';
  statusText.innerText = '';
  chatInput.disabled = true;
  sendBtn.disabled = true;
  chatLogs.innerHTML = '<div class="msg agent">Ready to answer clinical questions about the scan.</div>';
};

analyzeBtn.onclick = async () => {
  statusText.innerText = 'Uploading and analyzing...';
  analyzeBtn.disabled = true;
  
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_base64: imgBase64,
        hf_token: document.getElementById('hfToken').value,
        model_choice: document.getElementById('modelSelect').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      activePath = data.image_path;
      reportText.innerText = data.report;
      statusText.innerText = 'Done!';
      chatInput.disabled = false;
      sendBtn.disabled = false;
    } else {
      statusText.innerText = 'Error: ' + (data.detail || 'Failed');
      analyzeBtn.disabled = false;
    }
  } catch (err) {
    statusText.innerText = 'Error: ' + err.message;
    analyzeBtn.disabled = false;
  }
};

async function sendMsg() {
  const q = chatInput.value.trim();
  if (!q || !activePath) return;
  
  appendChat(q, 'doc');
  chatInput.value = '';
  
  const loader = appendChat('Thinking...', 'agent');
  
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_path: activePath,
        question: q,
        hf_token: document.getElementById('hfToken').value,
        model_choice: document.getElementById('modelSelect').value
      })
    });
    const data = await res.json();
    loader.remove();
    if (res.ok) {
      appendChat(data.answer, 'agent');
    } else {
      appendChat('Error: ' + (data.detail || 'Failed'), 'agent');
    }
  } catch (err) {
    loader.remove();
    appendChat('Error: ' + err.message, 'agent');
  }
}

sendBtn.onclick = sendMsg;
chatInput.onkeypress = (e) => {
  if (e.key === 'Enter') sendMsg();
};

function appendChat(text, sender) {
  const d = document.createElement('div');
  d.className = 'msg ' + sender;
  d.innerText = text;
  chatLogs.appendChild(d);
  chatLogs.scrollTop = chatLogs.scrollHeight;
  return d;
}
</script>
</body>
</html>
